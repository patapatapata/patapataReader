    <!-- 拡大表示用ダイアログ -->
    <dialog class="lightbox" id="lightbox" aria-label="拡大表示">
        <div class="lightbox-inner">
            <img id="lightbox-img" src="" alt="">
            <p class="lightbox-caption" id="lightbox-caption"></p>
            <div class="lightbox-bar">
                <button type="button" id="lb-prev">前へ</button>
                <button type="button" id="lb-next">次へ</button>
                <button type="button" id="lb-close">閉じる</button>
            </div>
        </div>
    </dialog>

    <script>
    (function () {
        var shots = Array.prototype.slice.call(document.querySelectorAll('.shot'));
        var dlg = document.getElementById('lightbox');
        var lbImg = document.getElementById('lightbox-img');
        var lbCap = document.getElementById('lightbox-caption');
        var current = -1;

        // 画像が見つからない場合は「画像準備中」を表示
        shots.forEach(function (shot) {
            var img = shot.querySelector('img');
            var frame = shot.querySelector('.shot-frame');
            function showMissing() {
                shot.classList.add('is-missing');
                var box = document.createElement('span');
                box.className = 'shot-missing';
                box.textContent = '画像準備中：' + img.getAttribute('src');
                img.replaceWith(box);
            }
            img.addEventListener('error', showMissing);
            if (img.complete && img.naturalWidth === 0) showMissing();

            frame.addEventListener('click', function () {
                if (shot.classList.contains('is-missing')) return;
                open(shots.indexOf(shot));
            });
        });

        function visibleShots() {
            return shots.filter(function (s) { return !s.classList.contains('is-missing'); });
        }

        function open(i) {
            var s = shots[i];
            var img = s.querySelector('img');
            if (!img) return;
            current = i;
            lbImg.src = img.currentSrc || img.src;
            lbImg.alt = img.alt;
            if (!dlg.open) dlg.showModal();
        }

        function step(dir) {
            var list = visibleShots();
            if (list.length < 2) return;
            var pos = list.indexOf(shots[current]);
            var next = list[(pos + dir + list.length) % list.length];
            open(shots.indexOf(next));
        }

        document.getElementById('lb-prev').addEventListener('click', function () { step(-1); });
        document.getElementById('lb-next').addEventListener('click', function () { step(1); });
        document.getElementById('lb-close').addEventListener('click', function () { dlg.close(); });

        // 画像の外側（背景）クリックで閉じる
        dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

        // キーボード操作：← → で前後、Esc で閉じる（Escはdialog標準）
        document.addEventListener('keydown', function (e) {
            if (!dlg.open) return;
            if (e.key === 'ArrowLeft') step(-1);
            if (e.key === 'ArrowRight') step(1);
        });
    })();
    </script>
