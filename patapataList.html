<!DOCTYPE html>
<html><head><meta charset='utf-8'>
<title>ぱたぱた差分リスト</title>

<style>
body{font-family:'Segoe UI',sans-serif;background:#f8f9fa;padding:40px 20px}
h3{padding:.5em 1em;border-left:10px solid #5e5e5e;border-bottom:2px solid #5e5e5e;background:#f0f0f0;font-size:1.25rem;font-weight:bold;color:#222}
table{border-collapse:collapse;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.12);width:100%;table-layout:fixed;border-radius:12px;overflow:hidden}
td{border-bottom:1px solid #e8eaf6;border-right:1px solid #e8eaf6;padding:10px;text-align:center;vertical-align:middle}
.target-image{max-width:100%;height:auto;cursor:pointer}
.target-image:hover{transform:scale(1.05)}
.switch-btn{padding:10px 20px;cursor:pointer;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:25px;font-weight:600}
@media print{
*{box-shadow:none!important;border-radius:0!important}
.no-print{display:none!important}
h3{break-before:page;background:#DDD!important;color:#000!important}
table{width:100%!important;border:1px solid #000!important;border-collapse:collapse}
td{border:1px solid #000!important}
.target-image{max-width:270px!important}
}
#modalOverlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center}
#modalContainer{width:95vw;height:95vh;display:flex;flex-direction:column}
#thresholdSlider,#zoomSlider{width:120px}
#toolbarHelp{flex:1;min-width:200px}
#diffCanvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#closeBtn,#diffModeBtn{padding:8px 16px;cursor:pointer}
#cursors{width:40px;height:40px;padding:0;justify-content:center;align-items:center;font-size:16px;cursor:pointer;background-color:#ddd;border:none;border-radius:50%}
#imageWrapper{flex:1;overflow:auto;display:flex;justify-content:flex-start;align-items:flex-start;min-height:0}
#imageWrapper.scrollable,#imageWrapper.scrollable *{cursor:grab}
#imageWrapper.dragging,#imageWrapper.dragging *{cursor:grabbing!important;user-select:none}
#toolbar{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.95);padding:8px 12px;border-top:1px solid #ccc}
#imageInner{display:inline-block;position:relative;flex-shrink:0;margin:auto}
#modalImgA{width:auto;height:auto;display:block;filter:url(#toBlueMono)}
#modalImgB{position:absolute;top:0;left:0;opacity:1;mix-blend-mode:multiply;cursor:default;user-select:none;transition:visibility .1s;filter:url(#toRedMono)}
</style>
<script>
let draggedElementId=null,originalMap={},swappedRows={},diffModeOn=false,DIFF_THRESHOLD=70;
function openModal(id){
  document.getElementById('bottomToolbar').style.display='none';
  const imgA=document.getElementById('imgA_'+id),imgB=document.getElementById('imgB_'+id),modalImgA=document.getElementById('modalImgA'),modalImgB=document.getElementById('modalImgB');
  if(imgA&&imgB){
    modalImgA.src=imgA.src;modalImgB.src=imgB.src;modalImgB.style.top='0px';modalImgB.style.left='0px';
    modalImgA.style.visibility=modalImgB.style.visibility='visible';document.getElementById('modalOverlay').style.display='flex';
    setTimeout(()=>{applyZoom();const w=document.getElementById('imageWrapper');w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;w.scrollTop=(w.scrollHeight-w.clientHeight)/2;diffModeOn?showDiffMode():showNormalMode()},50)
  }
}
function showDiffMode(){renderDiffHighlight();document.getElementById('diffCanvas').style.display='block';document.getElementById('modalImgA').style.opacity=document.getElementById('modalImgB').style.opacity=0;document.getElementById('diffModeBtn').textContent='通常表示';document.getElementById('thresholdControls').style.display='';diffModeOn=true}
function showNormalMode(){document.getElementById('diffCanvas').style.display='none';document.getElementById('modalImgA').style.opacity=document.getElementById('modalImgB').style.opacity=1;document.getElementById('diffModeBtn').textContent='差分表示';document.getElementById('thresholdControls').style.display='none';diffModeOn=false}
function toggleDiffMode(){diffModeOn?showNormalMode():showDiffMode()}
function closeModal(){document.getElementById('modalOverlay').style.display='none';document.getElementById('bottomToolbar').style.display='flex'}
window.addEventListener('load',()=>{
  document.querySelectorAll('tr').forEach(tr=>{
    const a=tr.querySelector('img[id^="imgA_"]'),b=tr.querySelector('img[id^="imgB_"]');
    if(a&&b){
      const id=a.id.replace('imgA_','');originalMap[id]={a:a.src,b:b.src};
      [a,b].forEach(img=>{img.draggable=true;img.addEventListener('dragstart',handleDragStart);img.addEventListener('dragend',handleDragEnd);img.addEventListener('dragover',handleDragOver);img.addEventListener('drop',handleDrop);img.onclick=()=>openModal(id)})
    }
  });
  document.getElementById('imageWrapper').addEventListener('wheel',function(e){e.preventDefault();const s=document.getElementById('zoomSlider');s.value=Math.max(parseInt(s.min),Math.min(parseInt(s.max),parseInt(s.value)+(e.deltaY<0?10:-10)));document.getElementById('zoomValue').textContent=s.value+'%';applyZoom()},{passive:false});
  document.getElementById('zoomSlider').addEventListener('input',function(){document.getElementById('zoomValue').textContent=this.value+'%';applyZoom()});
  document.getElementById('thresholdSlider').addEventListener('input',function(){DIFF_THRESHOLD=parseInt(this.value);document.getElementById('thresholdValue').textContent=DIFF_THRESHOLD;if(diffModeOn)renderDiffHighlight()});
  setupImageWrapperDragScroll();window.addEventListener('resize',updateWrapperScrollable)
});
document.addEventListener('keydown',e=>{
  const m=document.getElementById('modalOverlay'),b=document.getElementById('modalImgB');
  if(m.style.display!=='flex')return;
  if(e.key==='Escape'){closeModal();return}
  const step=e.shiftKey?10:1;let l=parseFloat(b.style.left||0),t=parseFloat(b.style.top||0),mv=false;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')l-=step;else if(e.key==='ArrowRight')l+=step;else if(e.key==='ArrowUp')t-=step;else if(e.key==='ArrowDown')t+=step;b.style.left=l+'px';b.style.top=t+'px';renderDiffHighlight()}
});
function swapRow(id){const a=document.getElementById('imgA_'+id),b=document.getElementById('imgB_'+id),tmp=a.src;a.src=b.src;b.src=tmp;swappedRows[id]=!swappedRows[id];document.getElementById('btn_'+id).style.background=swappedRows[id]?'linear-gradient(135deg,#e74c3c 0%,#c0392b 100%)':'linear-gradient(135deg,#667eea 0%,#764ba2 100%)'}
window.addEventListener('beforeprint',()=>{for(var id in originalMap){const a=document.getElementById('imgA_'+id),b=document.getElementById('imgB_'+id);if(a&&b){a.src=originalMap[id].a;b.src=originalMap[id].b}}});
function handleDragStart(e){draggedElementId=e.target.id;e.dataTransfer.effectAllowed='copyMove';e.target.style.opacity='0.4'}
function handleDragEnd(e){e.target.style.opacity='1'}
function handleDragOver(e){e.preventDefault()}
function handleDrop(e){e.preventDefault();const s=document.getElementById(draggedElementId);if(s&&s!==e.target){const t=s.src;s.src=e.target.src;e.target.src=t}}
function heatColor(t){t=t<0?0:(t>1?1:t);return[Math.round(255+(0)*t),Math.round(210+(-210)*t),Math.round(255+(0)*t)]}
function renderDiffHighlight(){
  const imgA=document.getElementById('modalImgA'),imgB=document.getElementById('modalImgB'),can=document.getElementById('diffCanvas');
  if(!imgA.src||!imgB.src||!imgA.naturalWidth)return;
  const w=imgA.naturalWidth,h=imgA.naturalHeight;can.width=w;can.height=h;can.style.width=imgA.clientWidth+'px';can.style.height=imgA.clientHeight+'px';
  const cA=document.createElement('canvas'),cB=document.createElement('canvas');cA.width=cB.width=w;cA.height=cB.height=h;cA.getContext('2d').drawImage(imgA,0,0,w,h);cB.getContext('2d').drawImage(imgB,parseFloat(imgB.style.left||0)*(w/imgA.clientWidth),parseFloat(imgB.style.top||0)*(w/imgA.clientWidth),w,h);
  const dA=cA.getContext('2d').getImageData(0,0,w,h).data,dB=cB.getContext('2d').getImageData(0,0,w,h).data,out=can.getContext('2d').createImageData(w,h);
  for(let i=0;i<dA.length;i+=4){
    const vA=dA[i+3]>0,vB=dB[i+3]>0;let diff=false;
    if(vA!==vB)diff=true;else if(vA&&vB){const d=Math.abs(dA[i]-dB[i])+Math.abs(dA[i+1]-dB[i+1])+Math.abs(dA[i+2]-dB[i+2]);if(d>DIFF_THRESHOLD)diff=true}
    if(diff){const c=heatColor(vA&&vB?(Math.abs(dA[i]-dB[i])+Math.abs(dA[i+1]-dB[i+1])+Math.abs(dA[i+2]-dB[i+2])-DIFF_THRESHOLD)/(765-DIFF_THRESHOLD):1);out.data[i]=c[0];out.data[i+1]=c[1];out.data[i+2]=c[2];out.data[i+3]=255}
    else{const g=(dA[i]+dA[i+1]+dA[i+2])/3,d=255-(255-g)*0.35;out.data[i]=out.data[i+1]=out.data[i+2]=d;out.data[i+3]=255}
  }
  can.getContext('2d').putImageData(out,0,0)
}
function applyZoom(){
  const iA=document.getElementById('modalImgA'),iB=document.getElementById('modalImgB'),wP=document.getElementById('imageWrapper'),z=parseInt(document.getElementById('zoomSlider').value)/100;
  const oW=parseFloat(iA.style.width)||iA.naturalWidth||1,oH=parseFloat(iA.style.height)||iA.naturalHeight||1,sc=wP.classList.contains('scrollable');
  const cX=sc?(wP.scrollLeft+wP.clientWidth/2):(oW/2),cY=sc?(wP.scrollTop+wP.clientHeight/2):(oH/2),w=Math.round(iA.naturalWidth*z),h=Math.round(iA.naturalHeight*z);
  iA.style.width=iB.style.width=document.getElementById('diffCanvas').style.width=w+'px';iA.style.height=iB.style.height=document.getElementById('diffCanvas').style.height=h+'px';
  if(diffModeOn)renderDiffHighlight();updateWrapperScrollable();wP.scrollLeft=cX*(w/oW)-wP.clientWidth/2;wP.scrollTop=cY*(h/oH)-wP.clientHeight/2
}
function updateWrapperScrollable(){const w=document.getElementById('imageWrapper');w.classList.toggle('scrollable',w.scrollWidth>w.clientWidth||w.scrollHeight>w.clientHeight)}
function setupImageWrapperDragScroll(){
  const w=document.getElementById('imageWrapper');let d=false,sX,sY,sL,sT;
  w.addEventListener('mousedown',e=>{if(!w.classList.contains('scrollable'))return;d=true;sX=e.pageX;sY=e.pageY;sL=w.scrollLeft;sT=w.scrollTop;w.classList.add('dragging');e.preventDefault()});
  document.addEventListener('mousemove',e=>{if(d){e.preventDefault();w.scrollLeft=sL-(e.pageX-sX);w.scrollTop=sT-(e.pageY-sY)}});
  document.addEventListener('mouseup',()=>{if(d){d=false;w.classList.remove('dragging')}});w.addEventListener('mouseleave',()=>{if(d){d=false;w.classList.remove('dragging')}})
}
function updateImageSize(v){document.getElementById('val_size').innerText=v;for(let i of document.getElementsByClassName('target-image')){if(!i.naturalWidth)continue;const m=Math.min(parseInt(v),i.naturalWidth);i.style.maxWidth=`calc(min(${m}px, 100%))`;i.style.maxHeight=(m*(i.naturalHeight/i.naturalWidth))+'px';i.style.width='auto';i.style.height='auto'}}
function moveOverlay(dx,dy){const b=document.getElementById('modalImgB');b.style.left=(parseFloat(b.style.left||0)+dx)+'px';b.style.top=(parseFloat(b.style.top||0)+dy)+'px';if(diffModeOn)renderDiffHighlight()}
let moveInterval=null,delayTimeout=null;
function startMoving(dx,dy){stopMoving();moveOverlay(dx,dy);delayTimeout=setTimeout(()=>{moveInterval=setInterval(()=>moveOverlay(dx,dy),50)},300)}
function stopMoving(){if(delayTimeout){clearTimeout(delayTimeout);delayTimeout=null}if(moveInterval){clearInterval(moveInterval);moveInterval=null}}
</script>
